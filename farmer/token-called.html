<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan — Token Called</title>
  <meta name="description" content="Your token has been called at the APMC centre. Please proceed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="token-called.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body class="tc-body">
  <div class="app-container tc-container">

    <!-- ========== TOP BAR ========== -->
    <header class="tc-topbar">
      <button class="tc-back-btn" id="backBtn" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="tc-topbar-title">
        <h1 data-i18n="called.tokenCalled">Your Token is Called!</h1>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="tc-main">

      <!-- Alert / Status Area -->
      <section class="tc-alert-section">
        <div class="tc-alert-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#207A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <h2 class="tc-alert-title" data-i18n="called.tokenCalled">YOUR TOKEN IS CALLED</h2>
        <p class="tc-alert-subtitle" data-i18n="called.proceedImmediately">Please proceed to the weighbridge immediately.</p>
      </section>

      <!-- Main Highlight Card -->
      <div class="tc-highlight-card">
        
        <!-- Token Details -->
        <div class="tc-token-area">
          <span class="tc-token-label" data-i18n="home.tokenNo">TOKEN NUMBER</span>
          <h1 class="tc-token-value" id="tcToken">—</h1>
          
          <div class="tc-centre-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="tcCentre">—</span>
          </div>
        </div>

        <div class="tc-divider"></div>

        <!-- Location / Counter Instructions -->
        <div class="tc-instruction-area">
          <div class="tc-instruction-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <div class="tc-instruction-text">
            <span class="tc-instruction-label" data-i18n="called.headToCounter">Proceed to</span>
            <span class="tc-instruction-value" id="tcCounter">Assigned Counter / Weighbridge</span>
          </div>
        </div>

        <div class="tc-status-row" aria-label="Current status: Called">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>
          <span data-i18n="status.called">Called</span>
        </div>

      </div>

      <!-- Action & QR Card -->
      <div class="tc-action-card">
        <p class="tc-action-desc" data-i18n="token.keepItSafe">Show this QR code to the officer at the counter to check-in your produce.</p>
        
        <div class="tc-qr-wrapper">
          <canvas id="tcQrCanvas" width="200" height="200"></canvas>
        </div>
        
        <button class="btn btn-primary btn-lg w-full tc-proceed-btn" id="proceedBtn">
          <span class="btn-text" data-i18n="called.viewQueue">View Live Queue</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" class="bnav-item" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a href="history.html" class="bnav-item" aria-label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="nav.history">History</span>
      </a>
      <a href="token-generated.html" class="bnav-item bnav-scan" aria-label="Scan QR">
        <div class="scan-fab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
        </div>
        <span data-i18n="nav.scan">Scan</span>
      </a>
      <a href="notifications.html" class="bnav-item" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span data-i18n="nav.alerts">Alerts</span>
      </a>
      <a href="profile.html" class="bnav-item" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>

  </div>
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="js/qrCode.js"></script>
  <script src="token-called.js"></script>
</body>
</html>
