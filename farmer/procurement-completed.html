<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan - Procurement Completed</title>
  <meta name="description" content="Your crop procurement has been completed successfully.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="procurement-completed.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body class="pc-body">
  <div class="app-container pc-container">
    <header class="pc-topbar">
      <button class="pc-back-btn" id="backBtn" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 data-i18n="completed.procurementCompleted">Procurement Completed</h1>
    </header>

    <main class="pc-main">
      <section class="pc-success-heading">
        <div class="pc-success-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 data-i18n="completed.procurementCompleted">Procurement Completed</h2>
        <p data-i18n="completed.successMessage">Your produce has been received and recorded successfully.</p>
      </section>

      <section class="pc-summary-card" aria-label="Completed procurement summary">
        <div class="pc-summary-top">
          <span class="pc-summary-label" data-i18n="completed.procurementDetails">Procurement Summary</span>
          <span class="pc-completed-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span data-i18n="status.completed">Completed</span>
          </span>
        </div>
        <div class="pc-amount" id="pcAmount">—</div>
        <div class="pc-detail-grid">
          <div><span data-i18n="confirm.crop">Crop</span><strong id="pcCrop">—</strong></div>
          <div><span data-i18n="completed.totalWeight">Quantity</span><strong id="pcQuantity">—</strong></div>
          <div><span>Quality / Grade</span><strong id="pcGrade">—</strong></div>
          <div><span data-i18n="confirm.procurementCentre">Centre</span><strong id="pcCentre">—</strong></div>
          <div><span data-i18n="confirm.date">Procurement date</span><strong id="pcDate">—</strong></div>
          <div><span data-i18n="profile.loginStatus">Status</span><strong class="pc-status-value" id="pcStatus">Completed</strong></div>
        </div>
        <div class="pc-id-row">
          <span>Procurement ID</span>
          <strong id="pcId">—</strong>
        </div>
      </section>

      <button class="pc-next-card" id="paymentBtn" aria-label="Open Payment Processing">
        <div class="pc-next-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M7 15h3"/></svg>
        </div>
        <div>
          <span>Next stage</span>
          <strong data-i18n="payment.paymentStatus">Payment Processing</strong>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" class="bnav-item" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a href="history.html" class="bnav-item" aria-label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="nav.history">History</span>
      </a>
      <a href="token-generated.html" class="bnav-item bnav-scan" aria-label="Scan QR">
        <div class="scan-fab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
        </div>
        <span data-i18n="nav.scan">Scan</span>
      </a>
      <a href="notifications.html" class="bnav-item" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span data-i18n="nav.alerts">Alerts</span>
      </a>
      <a href="profile.html" class="bnav-item" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </div>
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="procurement-completed.js"></script>
</body>
</html>
