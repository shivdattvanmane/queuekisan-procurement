<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan — Login</title>
  <meta name="description" content="Login to QueueKisan — your digital farming companion for crop procurement.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body>
  <div class="app-container auth-page">

    <!-- Language Selector -->
    <div class="lang-selector-container">
      <button class="lang-selector-btn" id="langSelectorBtn" aria-label="Change language">
        <span class="lang-selector-icon">🌐</span>
        <span class="lang-selector-text" id="langSelectorText">English</span>
      </button>
      <div class="lang-selector-menu" id="langSelectorMenu" style="display:none;">
        <button class="lang-option" data-lang="en">English</button>
        <button class="lang-option" data-lang="mr">मराठी</button>
        <button class="lang-option" data-lang="hi">हिंदी</button>
      </div>
    </div>

    <!-- Top Branding Area -->
    <div class="auth-brand-area">
      <!-- Decorative leaf shapes -->
      <div class="brand-leaf leaf-1"></div>
      <div class="brand-leaf leaf-2"></div>
      <div class="brand-leaf leaf-3"></div>

      <div class="brand-content">
        <div class="brand-logo-circle">
          <span>🌾</span>
        </div>
        <h1 class="brand-name">QueueKisan</h1>
        <p class="brand-tagline" data-i18n="auth.registerSubtitle">Your Digital Farming Companion</p>
      </div>
    </div>

    <!-- Login Form Card -->
    <div class="auth-form-area">
      <div class="auth-card">
        <div class="auth-card-header">
          <h2 data-i18n="auth.welcomeBack">Welcome Back!</h2>
          <p data-i18n="auth.loginSubtitle">Login with your mobile number to continue</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <!-- Mobile Number -->
          <div class="form-group">
            <label for="loginMobile" data-i18n="auth.mobileNumber">Mobile Number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
              </span>
              <input
                type="tel"
                id="loginMobile"
                name="mobile"
                data-i18n="auth.mobileHint"
                data-i18n-attr="placeholder"
                maxlength="10"
                pattern="[0-9]{10}"
                inputmode="numeric"
                autocomplete="tel"
                required
              >
            </div>
            <span class="field-error" id="loginMobileError"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword" data-i18n="auth.password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input
                type="password"
                id="loginPassword"
                name="password"
                data-i18n="auth.passwordHint"
                data-i18n-attr="placeholder"
                minlength="6"
                autocomplete="current-password"
                required
              >
              <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('loginPassword', this)">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </button>
            </div>
            <span class="field-error" id="loginPasswordError"></span>
          </div>

          <!-- Forgot Password -->
          <div class="form-actions-row">
            <a href="#" class="forgot-link" id="forgotPasswordLink" data-i18n="auth.forgotPassword">Forgot Password?</a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
            <span class="btn-text" data-i18n="auth.login">Login</span>
            <span class="btn-loader" style="display:none;">
              <span class="spinner"></span>
            </span>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span data-i18n="common.or">or</span>
        </div>

        <!-- Register CTA -->
        <div class="auth-switch">
          <p data-i18n="auth.noAccount">New to QueueKisan?</p>
          <a href="register.html" class="btn btn-outline w-full" data-i18n="auth.registerHere">Create an Account</a>
        </div>
      </div>

      <!-- Footer Note -->
      <p class="auth-footer">
        🌿 QueueKisan — Empowering Farmers Digitally
      </p>
    </div>

  </div>

  <!-- Translation Files -->
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="auth.js"></script>
</body>
</html>
