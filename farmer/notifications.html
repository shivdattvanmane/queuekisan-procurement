<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan — Notifications</title>
  <meta name="description" content="View your queue notifications and updates on QueueKisan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="notifications.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body>
  <div class="app-container">

    <!-- ========== TOP BAR ========== -->
    <header class="nf-topbar">
      <button class="nf-back-btn" id="backBtn" aria-label="Go to Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="nf-topbar-title">
        <h1 data-i18n="notifications.notifications">Notifications</h1>
      </div>
      <button class="nf-clear-btn" id="markAllReadBtn" title="Mark all as read" data-i18n-title="notifications.markAllRead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="nf-main">

      <!-- FCM Info Banner -->
      <div class="nf-info-banner">
        <div class="nf-info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <p data-i18n="notifications.bannerText">You will be notified when your turn is near. Keep notifications enabled.</p>
      </div>

      <!-- Filters -->
      <div class="nf-filters">
        <button class="nf-filter-chip active" data-i18n="notifications.allUpdates">All Updates</button>
        <button class="nf-filter-chip"><span data-i18n="notifications.unread">Unread</span> <span class="nf-badge" id="unreadBadge">0</span></button>
      </div>

      <!-- Notifications List -->
      <div class="nf-list" id="notificationList">
        <!-- Populated by JS -->
      </div>

      <!-- Empty State -->
      <div class="nf-empty" id="emptyState" style="display: none;">
        <div class="nf-empty-icon">🔕</div>
        <p data-i18n="notifications.emptyStateText">No notifications yet.<br>Your queue updates will appear here.</p>
      </div>

    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" class="bnav-item" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a href="history.html" class="bnav-item" aria-label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="nav.history">History</span>
      </a>
      <a href="token-generated.html" class="bnav-item bnav-scan" aria-label="Scan QR">
        <div class="scan-fab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
        </div>
        <span data-i18n="nav.scan">Scan</span>
      </a>
      <a href="notifications.html" class="bnav-item active" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span data-i18n="nav.alerts">Alerts</span>
      </a>
      <a href="profile.html" class="bnav-item" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>

  </div>
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="js/realtime.js"></script>
  <script src="notifications.js"></script>
</body>
</html>
