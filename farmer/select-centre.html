<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan — Select Centre</title>
  <meta name="description" content="Select a procurement centre for your crop booking on QueueKisan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="select-centre.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body>
  <div class="app-container">

    <!-- ========== TOP BAR ========== -->
    <header class="sc-topbar">
      <button class="sc-back-btn" id="backBtn" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="sc-topbar-title">
        <h1 data-i18n="centre.selectCentre">Select Centre</h1>
        <p data-i18n="centre.step2of4">Step 2 of 4 — Choose your nearest APMC</p>
      </div>
    </header>

    <!-- ========== PROGRESS BAR ========== -->
    <div class="sc-progress-bar">
      <div class="sc-progress-track">
        <div class="sc-progress-fill" style="width: 50%;"></div>
      </div>
      <div class="sc-progress-steps">
        <span class="sc-step completed" data-i18n="step.crop">Crop</span>
        <span class="sc-step active" data-i18n="step.centre">Centre</span>
        <span class="sc-step" data-i18n="step.slot">Slot</span>
        <span class="sc-step" data-i18n="step.confirm">Confirm</span>
      </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="sc-main">

      <!-- Search & Filter -->
      <div class="sc-search-wrap">
        <svg class="sc-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          type="search"
          class="sc-search-input"
          id="centreSearch"
          placeholder="Search centres..."
          data-i18n="centre.searchCentres"
          data-i18n-attr="placeholder"
          autocomplete="off"
        >
      </div>

      <!-- Centre List -->
      <div class="sc-centre-list" id="centreList">
        <div class="skeleton-card" style="height: 100px; border-radius: 16px;"></div>
        <div class="skeleton-card" style="height: 100px; border-radius: 16px;"></div>
        <div class="skeleton-card" style="height: 100px; border-radius: 16px;"></div>
      </div>

      <!-- Empty State -->
      <div class="sc-empty" id="emptyState" style="display:none;">
        <div class="sc-empty-icon">📍</div>
        <p data-i18n="centre.noCentresFound">No procurement centres found nearby.</p>
      </div>

    </main>

    <!-- ========== BOTTOM ACTION BAR ========== -->
    <div class="sc-bottom-bar" id="bottomBar">
      <div class="sc-selected-info" id="selectedInfo">
        <span class="sc-selected-label" data-i18n="centre.noCentreSelected">No centre selected</span>
      </div>
      <button class="sc-continue-btn disabled" id="continueBtn" disabled>
        <span class="btn-text">Continue to Slot</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

  </div>
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="select-centre.js?v=4"></script>
</body>
</html>
