<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueueKisan - History</title>
  <meta name="description" content="View your booking and procurement history on QueueKisan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="i18n/i18n.css">
</head>
<body class="history-body">
  <div class="app-container history-container">
    <header class="history-topbar">
      <button class="history-back-btn" id="backBtn" aria-label="Go to Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 data-i18n="history.history">History</h1>
    </header>

    <main class="history-main">
      <section class="history-heading">
        <h2 data-i18n="history.history">Your records</h2>
        <p data-i18n="history.emptyState">Keep track of your bookings and completed procurements.</p>
      </section>

      <section class="history-section" aria-labelledby="bookingHistoryTitle">
        <div class="history-section-heading">
          <div class="history-section-icon booking-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <h2 id="bookingHistoryTitle" data-i18n="confirm.bookingDetails">Booking History</h2>
        </div>
        <div class="history-list" id="bookingList"></div>
        <div class="history-empty" id="bookingEmpty" hidden>
          <div class="history-empty-icon">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
          </div>
          <strong data-i18n="home.noBookingTitle">No booking history yet</strong>
          <p data-i18n="history.emptyState">Your past bookings will appear here.</p>
        </div>
      </section>

      <section class="history-section" aria-labelledby="procurementHistoryTitle">
        <div class="history-section-heading">
          <div class="history-section-icon procurement-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg>
          </div>
          <h2 id="procurementHistoryTitle" data-i18n="procure.procurementProcess">Procurement History</h2>
        </div>
        <div class="history-list" id="procurementList"></div>
        <div class="history-empty" id="procurementEmpty" hidden>
          <div class="history-empty-icon">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20H6z"/><path d="M9 6h6M9 10h6M9 14h4"/></svg>
          </div>
          <strong data-i18n="history.noProcurements">No procurement history yet</strong>
          <p data-i18n="history.emptyState">Your completed procurements will appear here.</p>
        </div>
      </section>
    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav" id="bottomNav">
      <a href="index.html" class="bnav-item" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a href="history.html" class="bnav-item active" aria-label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="nav.history">History</span>
      </a>
      <a href="token-generated.html" class="bnav-item bnav-scan" aria-label="Scan QR">
        <div class="scan-fab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
        </div>
        <span data-i18n="nav.scan">Scan</span>
      </a>
      <a href="notifications.html" class="bnav-item" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span data-i18n="nav.alerts">Alerts</span>
      </a>
      <a href="profile.html" class="bnav-item" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </div>
  <script src="i18n/en.js"></script>
  <script src="i18n/mr.js"></script>
  <script src="i18n/hi.js"></script>
  <script src="i18n/translator.js"></script>
  <script src="js/appConfig.js"></script>
  <script src="js/krushiApi.js"></script>
  <script src="history.js"></script>
</body>
</html>
